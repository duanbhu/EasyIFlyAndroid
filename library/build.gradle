plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

group = 'com.xbdlib'
version = '1.0.0'

android {
    namespace 'com.xbdlib.speech'
    compileSdk 34
    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        languageVersion = '1.8'
        apiVersion = '1.8'
    }
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
    publishing { singleVariant('release') { withSourcesJar() } }
}

configurations { kotlin18Compiler; kotlin18Stdlib }

dependencies {
    api 'org.jetbrains.kotlin:kotlin-stdlib:1.8.0'
    api files('libs/Msc.jar')
    testImplementation 'junit:junit:4.13.2'
    kotlin18Compiler 'org.jetbrains.kotlin:kotlin-compiler-embeddable:1.8.0'
    kotlin18Stdlib 'org.jetbrains.kotlin:kotlin-stdlib:1.8.0'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                artifact(rootProject.file('dist/xbd-speech-recognition-1.0.0.aar')) {
                    builtBy tasks.named('bundleAar')
                }
                artifact tasks.named('releaseSourcesJar')
                artifactId = 'speech-recognition'
                pom {
                    name = 'XBD Speech Recognition'
                    description = 'Standalone EasyIFly-compatible Android speech recognition with configurable themes.'
                    withXml {
                        def dependency = asNode().appendNode('dependencies').appendNode('dependency')
                        dependency.appendNode('groupId', 'org.jetbrains.kotlin')
                        dependency.appendNode('artifactId', 'kotlin-stdlib')
                        dependency.appendNode('version', '1.8.0')
                        dependency.appendNode('scope', 'compile')
                    }
                }
            }
        }
        repositories { maven { name = 'Bundle'; url = rootProject.layout.projectDirectory.dir('dist/maven').asFile.toURI() } }
    }
}

tasks.register('bundleAar', Copy) {
    dependsOn 'assembleRelease'
    from(layout.buildDirectory.file('outputs/aar/library-release.aar'))
    into(rootProject.layout.projectDirectory.dir('dist'))
    rename { 'xbd-speech-recognition-1.0.0.aar' }
    doLast {
        // A file-based AAR must be self-contained: merge the proprietary SDK
        // classes into classes.jar instead of leaving them in nested libs/.
        def aar = rootProject.file('dist/xbd-speech-recognition-1.0.0.aar')
        def source = new java.util.zip.ZipFile(aar)
        def baseClasses = File.createTempFile('speech-base-classes-', '.jar')
        baseClasses.bytes = source.getInputStream(source.getEntry('classes.jar')).bytes
        def classesJar = File.createTempFile('speech-classes-', '.jar')
        def classesZip = new java.util.zip.ZipFile(baseClasses)
        def mscZip = new java.util.zip.ZipFile(file('libs/Msc.jar'))
        def classEntries = new LinkedHashSet<String>()
        def classOut = new java.util.zip.ZipOutputStream(new FileOutputStream(classesJar))
        [classesZip, mscZip].each { zip ->
            zip.entries().each { entry ->
                if (entry.directory || entry.name.startsWith('META-INF/')) return
                if (!classEntries.add(entry.name)) return
                classOut.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                classOut << zip.getInputStream(entry).bytes
                classOut.closeEntry()
            }
        }
        classOut.close(); classesZip.close(); mscZip.close()
        source.close()
        def rebuilt = File.createTempFile('speech-aar-', '.aar')
        def oldAar = new java.util.zip.ZipFile(aar)
        def out = new java.util.zip.ZipOutputStream(new FileOutputStream(rebuilt))
        oldAar.entries().each { entry ->
            if (entry.name == 'libs/Msc.jar' || entry.name == 'classes.jar') return
            out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
            out << oldAar.getInputStream(entry).bytes
            out.closeEntry()
        }
        out.putNextEntry(new java.util.zip.ZipEntry('classes.jar'))
        out << classesJar.bytes
        out.closeEntry(); out.close(); oldAar.close()
        aar.bytes = rebuilt.bytes
        baseClasses.delete(); classesJar.delete(); rebuilt.delete()
    }
}

tasks.register('verifyKotlin18Consumer', JavaExec) {
    dependsOn 'bundleAar'
    classpath = configurations.kotlin18Compiler
    mainClass = 'org.jetbrains.kotlin.cli.jvm.K2JVMCompiler'
    doFirst {
        def sdkJar = zipTree(rootProject.file('dist/xbd-speech-recognition-1.0.0.aar'))
            .matching { include 'classes.jar' }.singleFile
        args '-no-stdlib', '-no-reflect', '-jvm-target', '1.8',
            '-classpath', files(sdkJar, configurations.kotlin18Stdlib, android.bootClasspath).asPath,
            '-d', layout.buildDirectory.dir('kotlin18-consumer').get().asFile.absolutePath,
            file('../compat/SpeechKotlin18Consumer.kt').absolutePath
    }
}
