plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def speechSampleAppId = providers.gradleProperty('iflytekAppId')
    .orElse(providers.environmentVariable('IFLYTEK_APP_ID')).getOrElse('')

android {
    namespace 'com.xbdlib.speech.sample'
    compileSdk 34
    defaultConfig {
        applicationId 'com.xbdlib.speech.sample'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'IFLYTEK_APP_ID', groovy.json.JsonOutput.toJson(speechSampleAppId)
    }
    buildTypes {
        release { minifyEnabled true; signingConfig signingConfigs.debug; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation files(rootProject.file('dist/xbd-speech-recognition-1.0.0.aar'))
}

// The sample intentionally consumes the copied file AAR. Keep that file fresh
// when both library and sample are built in one Gradle invocation.
tasks.configureEach { dependsOn ':library:bundleAar' }
